schema_version: 1

context:
  name: llama-index-indices-managed-llama-cloud
  version: "0.12.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/llama_index_indices_managed_llama_cloud-${{ version }}.tar.gz
  sha256: d4bca39ee803209c9f6d5697c23d1e06027cb74bbe2df9a91d3854135a23c720

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - deprecated ==1.2.18
    - llama-cloud >=1.6.0,<2
    - python >=${{ python_min }},<4.0
    - llama-index-core >=0.13.0,<0.15
    - llamaindex-py-client >=0.1.19,<0.2.0

tests:
  - python:
      imports:
        - llama_index.indices.managed.llama_cloud
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: llama-index indices llama-cloud integration
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/run-llama/llama_index/tree/main/llama-index-integrations/indices/llama-index-indices-managed-llama-cloud

extra:
  recipe-maintainers:
    - pavelzw
    - jan-janssen
